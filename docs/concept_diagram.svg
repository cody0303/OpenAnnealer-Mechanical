<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- ===================== MAIN VIEW: FRONT / CROSS-SECTION ===================== -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111">Front view (feed + case-holder column)</text>

  <!-- Hopper: wide V-trough, loose cases standing roughly upright, jumbled -->
  <path d="M95,60 L215,150 L165,150 L70,90 Z" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M255,60 L200,145 L245,150 L295,95 Z" fill="none" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1.1" fill="#eef3fb">
    <rect x="128" y="82" width="11" height="24" transform="rotate(8 133 94)"/>
    <rect x="152" y="70" width="11" height="24" transform="rotate(-6 157 82)"/>
    <rect x="172" y="90" width="11" height="24" transform="rotate(14 177 102)"/>
    <rect x="140" y="105" width="11" height="24" transform="rotate(-10 145 117)"/>
    <rect x="185" y="68" width="11" height="24" transform="rotate(4 190 80)"/>
    <rect x="160" y="118" width="11" height="24" transform="rotate(6 165 130)"/>
  </g>
  <text x="30" y="45" font-size="13" fill="#111">Hopper</text>
  <text x="245" y="40" font-size="11" fill="#555">loose cases, dumped in bulk —</text>
  <text x="245" y="54" font-size="11" fill="#555">no hand-orienting; they settle</text>
  <text x="245" y="68" font-size="11" fill="#555">roughly base-down in the V-trough</text>

  <!-- Tilted singulator disk at the hopper throat, ~45deg -->
  <ellipse cx="200" cy="172" rx="34" ry="19" fill="#fff" stroke="#111" stroke-width="2" transform="rotate(-20 200 172)"/>
  <!-- stationary face plate behind the disk (dashed, mostly hidden) with a discharge cutout -->
  <ellipse cx="200" cy="172" rx="34" ry="19" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(-20 200 172)"/>
  <!-- single pocket (through-hole) -->
  <circle cx="213" cy="181" r="6" fill="#eef3fb" stroke="#111" stroke-width="1.3"/>
  <line x1="200" y1="172" x2="150" y2="205" stroke="#111" stroke-width="1"/>
  <text x="255" y="158" font-size="13" fill="#111">Singulator disk (tilted ~45°)</text>
  <text x="255" y="174" font-size="11" fill="#555">one through-hole pocket, sized to the</text>
  <text x="255" y="188" font-size="11" fill="#555">case head — catches one case rim-first</text>
  <text x="255" y="202" font-size="11" fill="#555">as it passes under the hopper; rides on a</text>
  <text x="255" y="216" font-size="11" fill="#555">stationary face plate (dashed) until the</text>
  <text x="255" y="230" font-size="11" fill="#555">pocket reaches the plate's discharge cutout</text>
  <text x="255" y="244" font-size="11" fill="#555">driven by feeder stepper; swap disk per family</text>

  <!-- Drop chute from disk discharge down to the coil column -->
  <path d="M195,198 L235,198 L242,240 L215,258 L190,240 Z" fill="none" stroke="#111" stroke-width="2"/>
  <text x="255" y="262" font-size="11" fill="#555">drop chute to holder</text>

  <!-- Coil mount bracket -->
  <rect x="152" y="263" width="160" height="105" fill="none" stroke="#111" stroke-width="2" rx="4"/>
  <g stroke="#c33" stroke-width="2" fill="none">
    <ellipse cx="232" cy="282" rx="55" ry="8"/>
    <ellipse cx="232" cy="301" rx="55" ry="8"/>
    <ellipse cx="232" cy="320" rx="55" ry="8"/>
    <ellipse cx="232" cy="339" rx="55" ry="8"/>
    <ellipse cx="232" cy="353" rx="55" ry="8"/>
  </g>
  <text x="318" y="273" font-size="13" fill="#111">Coil mount bracket</text>
  <text x="318" y="289" font-size="11" fill="#c33">coil (placeholder — not yet selected)</text>
  <line x1="160" y1="271" x2="160" y2="360" stroke="#111" stroke-width="3" stroke-dasharray="2 4"/>
  <circle cx="160" cy="296" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="318" y="305" font-size="11" fill="#555">slotted mount: coil height field-adjustable</text>
  <text x="318" y="320" font-size="11" fill="#555">once real coil bore/turns are known</text>

  <!-- Case in cook zone -->
  <path d="M207,357 L257,357 L257,330 L242,318 L222,318 L207,330 Z" fill="#eef3fb" stroke="#111" stroke-width="2"/>
  <text x="268" y="338" font-size="11" fill="#111">case held in coil</text>
  <text x="268" y="352" font-size="11" fill="#111">("cook zone" = neck/shoulder)</text>

  <!-- Swing arm: SHORT sweep, just clears the coil OD -->
  <line x1="115" y1="368" x2="257" y2="368" stroke="#111" stroke-width="4"/>
  <line x1="115" y1="368" x2="253" y2="392" stroke="#999" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M262,370 Q278,381 260,395" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="5" y="348" font-size="11" fill="#111">shelf, HOLD</text>
  <text x="5" y="361" font-size="11" fill="#111">(under coil)</text>
  <text x="5" y="454" font-size="11" fill="#999">shelf, DROP —</text>
  <text x="5" y="467" font-size="11" fill="#999">just clear of coil OD</text>

  <!-- Pivot post + height-adjust nut -->
  <rect x="107" y="368" width="16" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="8" y="396" font-size="10" fill="#111">vertical</text>
  <text x="8" y="408" font-size="10" fill="#111">pivot</text>
  <text x="8" y="420" font-size="10" fill="#111">post</text>

  <line x1="150" y1="368" x2="150" y2="342" stroke="#111" stroke-width="2"/>
  <rect x="140" y="333" width="20" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="268" y="378" font-size="11" fill="#555">shelf height set by thumb-nut on a stud</text>
  <text x="268" y="392" font-size="11" fill="#555">(manual, per case length — not firmware-set)</text>
  <text x="268" y="410" font-size="11" fill="#555">case-family insert cup on shelf top</text>
  <text x="268" y="424" font-size="11" fill="#555">handles rim/groove diameter</text>

  <!-- Drop point, no funnel -->
  <path d="M232,438 L232,470" stroke="#999" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="248" y="450" font-size="12" fill="#111">case drops straight down —</text>
  <text x="248" y="465" font-size="12" fill="#111">no funnel; drops into your own</text>
  <text x="248" y="480" font-size="12" fill="#111">catch area (sized separately)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- ===================== INSET: TOP VIEW OF ARM SWEEP ===================== -->
  <rect x="560" y="60" width="300" height="270" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="575" y="85" font-size="15" font-weight="bold" fill="#111">Top view — arm sweep</text>

  <!-- pivot -->
  <circle cx="660" cy="230" r="5" fill="#111"/>
  <text x="640" y="252" font-size="11" fill="#111" text-anchor="end">pivot</text>

  <!-- Coil OD circle drawn around the HOLD point -->
  <circle cx="660" cy="150" r="34" fill="none" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="660" y="108" font-size="11" fill="#c33" text-anchor="middle">coil OD</text>

  <!-- Hold position -->
  <line x1="660" y1="230" x2="660" y2="150" stroke="#111" stroke-width="4"/>
  <circle cx="660" cy="150" r="10" fill="none" stroke="#111" stroke-width="2"/>
  <text x="700" y="145" font-size="11" fill="#111">HOLD — case under coil bore</text>

  <!-- Drop position: small angle, just past the coil OD circle -->
  <line x1="660" y1="230" x2="722" y2="163" stroke="#999" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="722" cy="163" r="10" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="740" y="185" font-size="11" fill="#555">DROP — just past</text>
  <text x="740" y="199" font-size="11" fill="#555">the coil's OD,</text>
  <text x="740" y="213" font-size="11" fill="#555">case falls clear</text>

  <path d="M660,150 A80,80 0 0 1 722,163" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="700" y="230" font-size="11" fill="#777">sweep ≈ smallest angle that</text>
  <text x="700" y="244" font-size="11" fill="#777">clears the coil body — a function</text>
  <text x="700" y="258" font-size="11" fill="#777">of arm radius vs. coil OD, not a</text>
  <text x="700" y="272" font-size="11" fill="#777">fixed 90°. See DESIGN.md formula.</text>

  <text x="575" y="300" font-size="11" fill="#555">No mechanical hard-stop hardware — the RC servo itself</text>
  <text x="575" y="314" font-size="11" fill="#555">is the repeatable element (2 fixed commanded positions).</text>

  <!-- Legend -->
  <rect x="560" y="345" width="300" height="140" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="575" y="370" font-size="15" font-weight="bold" fill="#111">Legend</text>
  <circle cx="580" cy="390" r="5" fill="none" stroke="#c33" stroke-width="2"/>
  <text x="595" y="394" font-size="12" fill="#111">coil / heated zone (placeholder geometry)</text>
  <line x1="570" y1="414" x2="590" y2="414" stroke="#111" stroke-width="3"/>
  <text x="595" y="418" font-size="12" fill="#111">fixed / structural part</text>
  <line x1="570" y1="434" x2="590" y2="434" stroke="#999" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="595" y="438" font-size="12" fill="#111">moving part, alternate position shown</text>
  <text x="575" y="462" font-size="12" fill="#111">Full brief and rationale: docs/DESIGN.md</text>
</svg>
