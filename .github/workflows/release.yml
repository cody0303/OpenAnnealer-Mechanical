name: Build and Release STL

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install OpenSCAD nightly
        run: sudo snap install openscad-nightly

      - name: Render STL from SCAD files
        run: |
          mkdir -p build
          find cad -name "*.scad" -print0 | while IFS= read -r -d '' f; do
            out="build/$(basename "${f%.scad}").stl"
            openscad-nightly --enable=import-function -o "$out" "$f"
          done

      - name: Create release with STL files
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.stl